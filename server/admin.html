<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南京大学课表 · 调休管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f8;color:#202436;font:16px/1.7 system-ui,sans-serif}main{max-width:960px;margin:60px auto;padding:0 24px}header p{color:#6d7282}h1{font-size:32px;margin:8px 0}.label{font-size:13px;letter-spacing:2px;color:#7353a4}section{background:white;border:1px solid #e3e5ec;border-radius:16px;padding:28px;margin-top:24px}button,select,input{font:inherit;border:1px solid #d4d7e1;border-radius:8px;padding:9px 12px;background:white}button{cursor:pointer}button.primary{background:#68468e;color:white;border-color:#68468e}button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.holiday-module{margin:24px 0}.module-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.module-head h2{font-size:18px;margin:0}.module-head button{padding:5px 10px;font-size:14px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 4px;border-bottom:1px solid #edf0f4}th{color:#6d7282;font-weight:500}#message{white-space:pre-wrap}small{color:#6d7282}input{max-width:100%}@media(max-width:600px){main{margin:24px auto;padding:0 12px}section{padding:16px}td input{width:130px;padding:6px;font-size:14px}}
</style>
<main><header><span class="label">NJU CALENDAR / ADMIN</span><h1>调休管理</h1><p>按学期维护放假与补课安排，学生下次拉取课表时自动同步。</p></header>
<section><div class="toolbar"><label for="semester">学期</label><select id="semester"></select><button id="load">重新加载</button></div>
<p><small>放假日期的常规课程移动至对应补课日期；补课日期原有常规课程取消。补课日期留空表示仅放假。时间调课、加课、停课优先，考试不受影响。</small></p>
<div id="rows"></div>
<div class="toolbar"><button id="save" class="primary">保存本学期安排</button></div><p id="message" role="status" aria-live="polite"></p></section></main>
<script>
const select=document.querySelector('#semester'),rows=document.querySelector('#rows'),msg=document.querySelector('#message');let revision=0,dirty=false,current='',busy=false;
const modules={
  1:['中秋节','国庆节','元旦','运动会','其他'],
  2:['清明节','劳动节','端午节','其他'],
  3:['其他 1','其他 2'],
};
function setBusy(value){busy=value;document.querySelectorAll('button,select,input').forEach(e=>e.disabled=value)}
function semesterModules(){return modules[Number(select.value.slice(-1))]||[]}
function addRuleRow(group,rule={}){const label=group.dataset.label,tr=document.createElement('tr');tr.className='rule';for(const key of ['holiday','makeup']){const td=document.createElement('td'),input=document.createElement('input');input.type='date';input.value=rule[key]||'';input.setAttribute('aria-label',`${label}${key==='holiday'?'放假日期':'补课日期'}`);input.oninput=()=>dirty=true;td.append(input);tr.append(td)}const td=document.createElement('td'),button=document.createElement('button');button.type='button';button.textContent='删除';button.setAttribute('aria-label',`删除${label}日期`);button.onclick=()=>{tr.remove();if(!group.querySelector('.rule'))addRuleRow(group);dirty=true};td.append(button);tr.append(td);group.querySelector('tbody').append(tr)}
function addModule(label,rules){const group=document.createElement('section');group.className='holiday-module';group.dataset.label=label;const head=document.createElement('div');head.className='module-head';const title=document.createElement('h2');title.textContent=label;const add=document.createElement('button');add.type='button';add.textContent='＋ 添加放假日期';add.onclick=()=>{addRuleRow(group);dirty=true};head.append(title,add);const table=document.createElement('table');table.innerHTML='<thead><tr><th>放假日期</th><th>补课日期（可留空）</th><th>操作</th></tr></thead><tbody></tbody>';group.append(head,table);for(const rule of rules.length?rules:[{}])addRuleRow(group,rule);rows.append(group)}
function renderRows(rules){rows.replaceChildren();const unassigned=[...rules.filter(rule=>!rule.label)];for(const label of semesterModules()){const assigned=rules.filter(rule=>rule.label===label);if(!assigned.length&&unassigned.length)assigned.push(unassigned.shift());addModule(label,assigned)}}
async function load(){if(dirty&&!confirm('放弃未保存的修改并重新加载？')){select.value=current;return}setBusy(true);msg.textContent='正在加载…';try{const r=await fetch('/api/holidays?semester='+encodeURIComponent(select.value));const d=await r.json();if(!r.ok)throw Error(d.error);renderRows(d.rules);revision=d.revision;current=select.value;dirty=false;msg.textContent=d.rules.length?'已加载，可编辑后保存。':'该学期暂无调休安排，请按对应模块填写。'}catch(e){msg.textContent='加载失败：'+e.message;select.value=current}finally{setBusy(false)}}
document.querySelector('#load').onclick=load;select.onchange=load;
document.querySelector('#save').onclick=async()=>{if(!current)return;const rules=[...rows.querySelectorAll('.holiday-module')].flatMap(group=>[...group.querySelectorAll('.rule')].map(tr=>({label:group.dataset.label,holiday:tr.children[0].firstChild.value,makeup:tr.children[1].firstChild.value||null}))).filter(r=>r.holiday);setBusy(true);try{const r=await fetch('/api/holidays',{method:'PUT',headers:{'Content-Type':'application/json','X-Calendar-Admin':'1'},body:JSON.stringify({semester:current,rules,revision})});const d=await r.json();if(!r.ok)throw Error(d.error);revision=d.revision;dirty=false;msg.textContent='已保存。学生下次拉取本学期课表时生效。'}catch(e){msg.textContent='保存失败：'+e.message}finally{setBusy(false)}};
window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
(async()=>{try{const r=await fetch('/api/semesters');if(!r.ok)throw Error('无法读取学期');const d=await r.json();const year=new Date().getFullYear();const ids=new Set(d.semesters);for(let y=year-5;y<=year+3;y++)for(let term=1;term<=3;term++)ids.add(`${y}-${y+1}-${term}`);for(const id of [...ids].sort().reverse()){const option=document.createElement('option');option.value=id;option.textContent=id.replace(/-(\d)$/,' 第$1学期');select.append(option)}const startYear=new Date().getMonth()>=7?year:year-1;select.value=`${startYear}-${startYear+1}-${new Date().getMonth()>=7?1:2}`;await load()}catch(e){msg.textContent=e.message}})();
</script></html>
